<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Motion Racing 3D</title><script src="https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;color:#fff;font-family:system-ui,sans-serif}#game{position:fixed;inset:0}#menu{position:fixed;z-index:10;inset:0;display:grid;place-items:center;background:radial-gradient(circle at top,#19376c,#050914 65%);padding:16px}.wrap{width:min(840px,96vw);max-height:96vh;overflow:auto;text-align:center}.logo{font-size:clamp(40px,8vw,76px);font-weight:1000;line-height:.9}.logo span{color:#ff4f9a}.section{text-align:left;margin-top:15px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice,button{background:#111b32;color:#fff;border:1px solid #ffffff28;border-radius:12px;padding:11px;font-weight:800}.choice{text-align:left}.choice.active{outline:2px solid #47e7ff;background:#172b52}.choice small{display:block;color:#aeb8ca;margin-top:4px}.colors,.actions{display:flex;gap:9px;flex-wrap:wrap}.swatch{width:40px;height:40px;border-radius:50%;padding:0}.swatch.active{outline:3px solid #fff;outline-offset:3px}.actions{justify-content:center;margin-top:18px}.primary{background:linear-gradient(135deg,#08bcd8,#5757ff)}.status{margin-top:10px;padding:10px;border-radius:10px;background:#08101f;color:#b8c3d8;text-align:left}.status.good{color:#72f4a6}.status.bad{color:#ff8b9b}#hud{position:fixed;z-index:5;inset:0;display:none;justify-content:space-between;pointer-events:none;padding:13px}.card{background:#07101fe8;border:1px solid #ffffff25;border-radius:14px;padding:10px 14px}.big{font-size:24px;font-weight:950}.muted{font-size:12px;color:#aeb8ca}#bottom{position:fixed;z-index:6;left:50%;bottom:10px;transform:translateX(-50%);display:none;gap:7px}#cameraBox{position:fixed;z-index:7;right:12px;bottom:65px;width:170px;background:#07101fe8;border:1px solid #ffffff25;border-radius:14px;padding:8px;display:none}#cameraVideo{width:100%;border-radius:9px;transform:scaleX(-1);background:#000}#prediction{font-size:11px}.bar{height:4px;background:#25304a}.fill{height:100%;background:#47e7ff}#countdown{position:fixed;z-index:20;inset:0;display:none;place-items:center;font-size:110px;font-weight:1000}#toast{position:fixed;z-index:25;top:18%;left:50%;transform:translateX(-50%);display:none;max-width:90vw;background:#0b1326f2;border:1px solid #fff3;border-radius:14px;padding:12px 18px;font-weight:850}@media(max-width:700px){.choices{grid-template-columns:1fr}#cameraBox{width:125px}}</style></head><body><div id="game"></div><div id="menu"><div class="wrap"><div class="logo">MOTION <span>RACING 3D</span></div><p>Pick a map and car, then race with gestures or keys.</p><div class="section"><h3>RACE MODE</h3><div class="choices" id="modes"><button class="choice active" data-v="5v5">5 vs 5<small>Ten racers</small></button><button class="choice" data-v="2v2">2 vs 2<small>Four racers</small></button></div></div><div class="section"><h3>MAP</h3><div class="choices" id="mapChoices"><button class="choice active" data-v="harbor">Neon Harbor<small>Easy</small></button><button class="choice" data-v="canyon">Canyon Climb<small>Hard</small></button><button class="choice" data-v="volcano">Volcano Gauntlet<small>Extreme</small></button></div></div><div class="section"><h3>CAR COLOR</h3><div class="colors" id="colors"></div></div><div id="cameraStatus" class="status">Tap Test Camera first.</div><div class="actions"><button id="testCamera">Test Camera</button><button id="startCamera" class="primary">Camera & Race</button><button id="startKeyboard">Race with Keys</button></div><p class="muted">Gestures: forward, backward, left, right. Keys: arrows or WASD.</p></div></div><div id="hud"><div class="card"><div class="muted">POSITION</div><div class="big"><span id="pos">1</span>/<span id="total">10</span></div><div class="muted">LAP <span id="lap">1</span>/3 · <span id="mapName"></span></div></div><div class="card"><div class="muted">SPEED</div><div class="big"><span id="speed">0</span> km/h</div><div id="controlLabel">Keys</div></div></div><div id="bottom"><button id="restart">Restart</button><button id="cameraToggle">Camera</button><button id="exit">Menu</button></div><div id="cameraBox"><video id="cameraVideo" muted playsinline autoplay></video><div id="prediction">Waiting…</div></div><div id="countdown">3</div><div id="toast"></div><script>
const $=id=>document.getElementById(id),colorsEl=$('colors'),video=$('cameraVideo'),predictionEl=$('prediction');let mode='5v5',mapKey='harbor',selectedColor='#35d9ff';['#35d9ff','#ff3f86','#ffb02e','#55e36a','#9a68ff','#fff','#ff4b35','#2f6fff'].forEach((c,i)=>{let b=document.createElement('button');b.className='swatch'+(i?'':' active');b.style.background=c;b.onclick=()=>{document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedColor=c};colorsEl.appendChild(b)});function bind(id,set){document.querySelectorAll('#'+id+' .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' .choice').forEach(x=>x.classList.remove('active'));b.classList.add('active');set(b.dataset.v)})}bind('modes',v=>mode=v);bind('mapChoices',v=>mapKey=v);
const maps={harbor:{name:'Neon Harbor',w:16,sky:0x07142d,g:0x163b31,r:0x292d38,p:[[0,0,0],[45,0,5],[75,0,40],[55,0,80],[10,0,92],[-35,0,78],[-65,0,42],[-58,0,0],[-28,0,-28],[12,0,-32]]},canyon:{name:'Canyon Climb',w:12,sky:0x2b160d,g:0x6b351e,r:0x312c2b,p:[[0,0,0],[38,5,0],[70,11,22],[58,18,57],[22,24,72],[-8,17,55],[-38,8,72],[-68,2,46],[-58,-2,8],[-25,5,-14],[5,12,-35],[38,6,-28]]},volcano:{name:'Volcano Gauntlet',w:10,sky:0x18050a,g:0x40120f,r:0x252329,p:[[0,4,0],[32,10,-8],[62,18,12],[48,25,42],[15,17,30],[-8,8,55],[-42,14,65],[-68,24,35],[-50,30,2],[-18,20,15],[5,10,-18],[38,17,-42],[68,9,-23]]}};let scene,camera,renderer,clock,curve,length,width,world,cars=[],player,running=false,started=false;function init3D(){if(renderer)return;scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000);renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.2));renderer.setSize(innerWidth,innerHeight);$('game').appendChild(renderer.domElement);clock=new THREE.Clock();scene.add(new THREE.HemisphereLight(0xddeeff,0x443322,2));addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}function build(){if(world)scene.remove(world);world=new THREE.Group();scene.add(world);let m=maps[mapKey];scene.background=new THREE.Color(m.sky);width=m.w;curve=new THREE.CatmullRomCurve3(m.p.map(x=>new THREE.Vector3(...x)),true,'catmullrom',.25);length=curve.getLength();let ground=new THREE.Mesh(new THREE.PlaneGeometry(650,650),new THREE.MeshLambertMaterial({color:m.g}));ground.rotation.x=-Math.PI/2;ground.position.y=-2;world.add(ground);let seg=280,pos=[],idx=[];for(let i=0;i<=seg;i++){let u=i/seg,p=curve.getPointAt(u),t=curve.getTangentAt(u),s=new THREE.Vector3(-t.z,0,t.x).normalize(),a=p.clone().add(s.clone().multiplyScalar(width/2)),b=p.clone().add(s.multiplyScalar(-width/2));pos.push(a.x,a.y,a.z,b.x,b.y,b.z);if(i<seg){let q=i*2;idx.push(q,q+1,q+2,q+1,q+3,q+2)}}let geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setIndex(idx);geo.computeVertexNormals();world.add(new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:m.r,side:THREE.DoubleSide})))}function car(color){let g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(3.2,1.1,5.2),new THREE.MeshLambertMaterial({color}));b.position.y=1;g.add(b);return g}function spawn(){cars=[];let n=mode==='5v5'?10:4;$('total').textContent=n;let cs=['#5d9cff','#3ce6a8','#a985ff','#ff4f9a','#ff8855'];for(let i=0;i<n;i++){let u=(1-i*.014+1)%1,p=curve.getPointAt(u),t=curve.getTangentAt(u),s=new THREE.Vector3(-t.z,0,t.x).normalize(),mesh=car(i?cs[(i-1)%cs.length]:selectedColor);mesh.position.copy(p).add(s.multiplyScalar((i%2?1:-1)*width*.18));mesh.rotation.y=Math.atan2(t.x,t.z);world.add(mesh);cars.push({mesh,u,last:u,lap:1,speed:0,heading:mesh.rotation.y,skill:.8+Math.random()*.15})}player=cars[0]}
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(running&&e.code.startsWith('Arrow'))e.preventDefault()},{passive:false});addEventListener('keyup',e=>keys[e.code]=false);let prediction={forward:0,backward:0,left:0,right:0},cameraOn=false,stream=null,model=null,timer=null,loading=null;function status(s,type=''){$('cameraStatus').textContent=s;$('cameraStatus').className='status '+type}function errorText(e){if(e.name==='NotAllowedError')return'Camera blocked. Allow camera access in browser settings and reload.';if(e.name==='NotReadableError')return'Camera is busy in another app or tab.';return e.message||String(e)}async function stopCamera(){cameraOn=false;clearTimeout(timer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null}async function loadModel(){if(model)return model;if(loading)return loading;loading=(async()=>{status('Loading gesture model…');if(!window.tf||!window.tmImage)throw Error('ML scripts failed to load. Reload with internet on.');await tf.setBackend('cpu');await tf.ready();model=await Promise.race([tmImage.load('https://teachablemachine.withgoogle.com/models/tA3k5fgDZ/model.json','https://teachablemachine.withgoogle.com/models/tA3k5fgDZ/metadata.json'),new Promise((_,r)=>setTimeout(()=>r(Error('Model load timed out.')),20000))]);return model})().finally(()=>loading=null);return loading}async function initCamera(){try{await stopCamera();if(!isSecureContext)throw Error('Camera requires HTTPS.');status('Waiting for permission…');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'user'},width:{ideal:320,max:480},height:{ideal:240,max:360},frameRate:{ideal:15,max:20}},audio:false});video.srcObject=stream;await video.play();await loadModel();cameraOn=true;$('cameraBox').style.display='block';status('Camera ready.','good');predict();return true}catch(e){console.error(e);await stopCamera();let m=errorText(e);status(m,'bad');toast(m);return false}}function predict(){clearTimeout(timer);if(!cameraOn)return;timer=setTimeout(async()=>{try{let out=await model.predict(video,false);prediction={forward:0,backward:0,left:0,right:0};out.forEach(q=>{let k=q.className.toLowerCase().trim();if(k in prediction)prediction[k]=q.probability});let s=Object.entries(prediction).sort((a,b)=>b[1]-a[1]);predictionEl.innerHTML=s.map(([k,v])=>`${k}: ${Math.round(v*100)}%<div class="bar"><div class="fill" style="width:${v*100}%"></div></div>`).join('');$('controlLabel').textContent=s[0][1]>.55?'Gesture: '+s[0][0]:'Waiting…'}catch(e){console.error(e);cameraOn=false;status('Prediction stopped: '+errorText(e),'bad');toast('Camera prediction stopped; keys still work.');return}predict()},200)}function input(){let th=0,st=0,b=Object.entries(prediction).sort((a,b)=>b[1]-a[1])[0];if(cameraOn&&b&&b[1]>.55){if(b[0]==='forward')th=1;if(b[0]==='backward')th=-1;if(b[0]==='left')st=-1;if(b[0]==='right')st=1}if(keys.ArrowUp||keys.KeyW)th=1;if(keys.ArrowDown||keys.KeyS)th=-1;if(keys.ArrowLeft||keys.KeyA)st=-1;if(keys.ArrowRight||keys.KeyD)st=1;return{th,st}}function near(pos,g){let bu=g,bd=1e9;for(let j=-8;j<=8;j++){let u=(g+j*.003+1)%1,d=curve.getPointAt(u).distanceToSquared(pos);if(d<bd){bd=d;bu=u}}return{u:bu,d:Math.sqrt(bd)}}function progress(c){let n=near(c.mesh.position,c.u);c.last=c.u;c.u=n.u;if(c.last>.9&&c.u<.1&&c.speed>0)c.lap++;c.progress=(c.lap-1)+c.u;return n.d}function update(dt){if(!started)return;let i=input();player.speed+=i.th*28*dt;player.speed*=Math.pow(.987,dt*60);player.speed=THREE.MathUtils.clamp(player.speed,-7,42);player.heading+=i.st*(1.15+Math.abs(player.speed)/55)*dt*Math.sign(player.speed||1);player.mesh.rotation.y=player.heading;player.mesh.position.x+=Math.sin(player.heading)*player.speed*dt;player.mesh.position.z+=Math.cos(player.heading)*player.speed*dt;let d=progress(player),center=curve.getPointAt(player.u);player.mesh.position.y=THREE.MathUtils.lerp(player.mesh.position.y,center.y,.16);if(d>width*.52){player.speed*=.92;player.mesh.position.lerp(center,.02)}for(let x=1;x<cars.length;x++){let c=cars[x];c.speed+=(31+c.skill*8-c.speed)*dt*1.6;let target=curve.getPointAt((c.u+(8+c.speed*.35)/length)%1),des=Math.atan2(target.x-c.mesh.position.x,target.z-c.mesh.position.z),df=des-c.heading;while(df>Math.PI)df-=Math.PI*2;while(df<-Math.PI)df+=Math.PI*2;c.heading+=df*dt*(2.2+c.skill);c.mesh.rotation.y=c.heading;c.mesh.position.x+=Math.sin(c.heading)*c.speed*dt;c.mesh.position.z+=Math.cos(c.heading)*c.speed*dt;progress(c);c.mesh.position.y=THREE.MathUtils.lerp(c.mesh.position.y,curve.getPointAt(c.u).y,.2)}let ranked=[...cars].sort((a,b)=>b.progress-a.progress);$('pos').textContent=ranked.indexOf(player)+1;$('lap').textContent=Math.min(player.lap,3);$('speed').textContent=Math.max(0,Math.round(player.speed*6));let f=new THREE.Vector3(Math.sin(player.heading),0,Math.cos(player.heading)),ct=player.mesh.position.clone().add(new THREE.Vector3(0,2,0)),cp=ct.clone().add(f.clone().multiplyScalar(-12)).add(new THREE.Vector3(0,7,0));camera.position.lerp(cp,.12);camera.lookAt(ct.clone().add(f.multiplyScalar(8)))}function animate(){requestAnimationFrame(animate);if(running)update(Math.min(.033,clock.getDelta()));renderer.render(scene,camera)}function startGame(){build();spawn();$('mapName').textContent=maps[mapKey].name;$('menu').style.display='none';$('hud').style.display='flex';$('bottom').style.display='flex';running=true;started=false;let n=3;$('countdown').style.display='grid';$('countdown').textContent=n;let t=setInterval(()=>{n--;$('countdown').textContent=n>0?n:n===0?'GO!':'';if(n<0){clearInterval(t);$('countdown').style.display='none';started=true}},700)}function toast(s){let t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',4000)}$('testCamera').onclick=async()=>{let b=$('testCamera');b.disabled=true;let ok=await initCamera();b.disabled=false;if(ok)toast('Camera test passed!')};$('startCamera').onclick=async()=>{let b=$('startCamera');b.disabled=true;b.textContent='Starting…';let ok=await initCamera();b.disabled=false;b.textContent='Camera & Race';if(ok)startGame()};$('startKeyboard').onclick=async()=>{await stopCamera();$('cameraBox').style.display='none';startGame()};$('restart').onclick=startGame;$('cameraToggle').onclick=async()=>cameraOn?(await stopCamera(),$('cameraBox').style.display='none'):await initCamera();$('exit').onclick=()=>location.reload();init3D();animate();
</script></body></html>
