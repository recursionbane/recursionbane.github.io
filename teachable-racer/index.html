<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Motion Racing 3D</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<style>:root{color-scheme:dark;--c:#47e7ff;--p:#ff4f9a;--panel:#07101fe8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;color:white;font-family:system-ui,sans-serif}#game{position:fixed;inset:0}canvas{display:block}#menu{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 50% 15%,#19376c,#050914 65%)}.wrap{width:min(860px,96vw);max-height:96vh;overflow:auto;text-align:center}.logo{font-size:clamp(40px,8vw,78px);font-weight:1000;line-height:.9;letter-spacing:-4px;text-shadow:0 0 28px #39ddff88}.logo span{color:var(--p)}.section{text-align:left;margin-top:16px}.section h3{font-size:12px;color:#b9c7df;letter-spacing:.12em}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice,button,input,select{background:#111b32;color:white;border:1px solid #ffffff28;border-radius:12px;padding:11px;font-weight:800}.choice{text-align:left}.choice.active{outline:2px solid var(--c);background:#172b52}.choice small{display:block;color:#aeb8ca;margin-top:4px}.colors{display:flex;gap:9px;flex-wrap:wrap}.swatch{width:40px;height:40px;border-radius:50%;padding:0}.swatch.active{outline:3px solid white;outline-offset:3px}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:18px}.primary{background:linear-gradient(135deg,#08bcd8,#5757ff)}button:disabled{opacity:.55}.status{margin-top:10px;padding:10px;border-radius:10px;background:#08101f;color:#b8c3d8;text-align:left;font-size:13px}.status.good{color:#72f4a6}.status.bad{color:#ff8b9b}#hud{position:fixed;z-index:5;inset:0;pointer-events:none;padding:13px;display:none;justify-content:space-between}.card{background:var(--panel);border:1px solid #ffffff25;border-radius:14px;padding:10px 14px}.big{font-size:24px;font-weight:950}.muted{font-size:12px;color:#aeb8ca}.accent{color:var(--c)}#bottom{position:fixed;z-index:6;left:50%;bottom:10px;transform:translateX(-50%);display:none;gap:7px;flex-wrap:wrap;justify-content:center;width:95vw}#cameraBox{position:fixed;z-index:7;right:12px;bottom:66px;width:170px;background:var(--panel);border:1px solid #ffffff25;border-radius:14px;padding:8px;display:none}#cameraVideo{width:100%;border-radius:9px;transform:scaleX(-1);background:#000}#prediction{font-size:11px;margin-top:5px}.bar{height:4px;background:#25304a;border-radius:4px;margin:2px 0}.fill{height:100%;background:var(--c)}#countdown{position:fixed;z-index:20;inset:0;display:none;place-items:center;font-size:110px;font-weight:1000;text-shadow:0 0 40px #46e7ff}#toast{position:fixed;z-index:25;top:18%;left:50%;transform:translateX(-50%);display:none;max-width:90vw;background:#0b1326f2;border:1px solid #fff3;border-radius:14px;padding:12px 18px;font-weight:850;text-align:center}@media(max-width:700px){.choices{grid-template-columns:1fr}.logo{letter-spacing:-2px}.choice{padding:9px}#cameraBox{width:125px}}</style></head><body>
<div id="game"></div><div id="menu"><div class="wrap"><div class="logo">MOTION <span>RACING 3D</span></div><p>Pick a map and car, then race with gestures or keys.</p>
<div class="section"><h3>RACE MODE</h3><div class="choices" id="modes"><button class="choice active" data-v="5v5"><b>5 vs 5 Grand Prix</b><small>Ten racers.</small></button><button class="choice" data-v="2v2"><b>2 vs 2 Sprint</b><small>Four racers.</small></button></div></div>
<div class="section"><h3>MAP</h3><div class="choices" id="maps"><button class="choice active" data-v="harbor"><b>Neon Harbor</b><small>Fast and wide. ★★☆☆☆</small></button><button class="choice" data-v="canyon"><b>Canyon Climb</b><small>Hills and switchbacks. ★★★★☆</small></button><button class="choice" data-v="volcano"><b>Volcano Gauntlet</b><small>Narrow and brutal. ★★★★★</small></button></div></div>
<div class="section"><h3>CAR COLOR</h3><div class="colors" id="colors"></div></div>
<div class="section"><h3>CAMERA</h3><div id="cameraStatus" class="status">Not started. Tap “Test Camera” first.</div></div>
<div class="actions"><button id="testCamera">Test Camera</button><button id="startCamera" class="primary">Camera & Race</button><button id="startKeyboard">Race with Keys</button></div><p class="muted">Gestures: forward, backward, left, right. Keyboard: arrows or WASD.</p></div></div>
<div id="hud"><div class="card"><div class="muted">POSITION</div><div class="big"><span id="pos">1</span>/<span id="total">10</span></div><div class="muted">LAP <span id="lap">1</span>/3 · <span id="mapName"></span></div></div><div class="card" style="text-align:right"><div class="muted">SPEED</div><div class="big"><span id="speed">0</span> km/h</div><div class="accent" id="controlLabel">Keys</div></div></div>
<div id="bottom"><button id="restart">Restart</button><button id="cameraToggle">Camera</button><button id="exit">Menu</button></div><div id="cameraBox"><video id="cameraVideo" muted playsinline autoplay></video><div id="prediction">Waiting…</div></div><div id="countdown">3</div><div id="toast"></div>
<script>
const MODEL='https://teachablemachine.withgoogle.com/models/tA3k5fgDZ/';let mode='5v5',mapKey='harbor',selectedColor='#35d9ff';const colors=['#35d9ff','#ff3f86','#ffb02e','#55e36a','#9a68ff','#ffffff','#ff4b35','#2f6fff'];
colors.forEach((c,i)=>{const b=document.createElement('button');b.className='swatch'+(i?'':' active');b.style.background=c;b.onclick=()=>{document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedColor=c};colorsEl.appendChild(b)});function bind(id,set){document.querySelectorAll('#'+id+' .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' .choice').forEach(x=>x.classList.remove('active'));b.classList.add('active');set(b.dataset.v)})}bind('modes',v=>mode=v);bind('maps',v=>mapKey=v);
const maps={harbor:{name:'Neon Harbor',w:16,sky:0x07142d,g:0x163b31,r:0x292d38,p:[[0,0,0],[45,0,5],[75,0,40],[55,0,80],[10,0,92],[-35,0,78],[-65,0,42],[-58,0,0],[-28,0,-28],[12,0,-32]]},canyon:{name:'Canyon Climb',w:12,sky:0x2b160d,g:0x6b351e,r:0x312c2b,p:[[0,0,0],[38,5,0],[70,11,22],[58,18,57],[22,24,72],[-8,17,55],[-38,8,72],[-68,2,46],[-58,-2,8],[-25,5,-14],[5,12,-35],[38,6,-28]]},volcano:{name:'Volcano Gauntlet',w:10,sky:0x18050a,g:0x40120f,r:0x252329,p:[[0,4,0],[32,10,-8],[62,18,12],[48,25,42],[15,17,30],[-8,8,55],[-42,14,65],[-68,24,35],[-50,30,2],[-18,20,15],[5,10,-18],[38,17,-42],[68,9,-23]]}};
let scene,camera,renderer,clock,curve,length,width,world,cars=[],player,running=false,started=false;function init3D(){if(renderer)return;scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000);renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.setSize(innerWidth,innerHeight);game.appendChild(renderer.domElement);clock=new THREE.Clock();scene.add(new THREE.HemisphereLight(0xddeeff,0x443322,2));addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}
function clear(){if(world)scene.remove(world);world=new THREE.Group();scene.add(world)}function build(){clear();const m=maps[mapKey];scene.background=new THREE.Color(m.sky);width=m.w;curve=new THREE.CatmullRomCurve3(m.p.map(x=>new THREE.Vector3(...x)),true,'catmullrom',.25);length=curve.getLength();const ground=new THREE.Mesh(new THREE.PlaneGeometry(650,650),new THREE.MeshLambertMaterial({color:m.g}));ground.rotation.x=-Math.PI/2;ground.position.y=-2;world.add(ground);const seg=320,pos=[],idx=[];for(let i=0;i<=seg;i++){const u=i/seg,p=curve.getPointAt(u),t=curve.getTangentAt(u),s=new THREE.Vector3(-t.z,0,t.x).normalize();const a=p.clone().add(s.clone().multiplyScalar(width/2)),b=p.clone().add(s.multiplyScalar(-width/2));pos.push(a.x,a.y,a.z,b.x,b.y,b.z);if(i<seg){let q=i*2;idx.push(q,q+1,q+2,q+1,q+3,q+2)}}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setIndex(idx);geo.computeVertexNormals();world.add(new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:m.r,side:THREE.DoubleSide})));}
function car(color){const g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(3.2,1.1,5.2),new THREE.MeshLambertMaterial({color}));b.position.y=1;g.add(b);const c=new THREE.Mesh(new THREE.BoxGeometry(2.4,.9,2.2),new THREE.MeshLambertMaterial({color:0x111827}));c.position.set(0,1.8,-.2);g.add(c);return g}function spawn(){cars=[];const n=mode==='5v5'?10:4;total.textContent=n;const cs=['#5d9cff','#3ce6a8','#a985ff','#ff4f9a','#ff8855','#ffcc55'];for(let i=0;i<n;i++){let u=(1-i*.014+1)%1,p=curve.getPointAt(u),t=curve.getTangentAt(u),s=new THREE.Vector3(-t.z,0,t.x).normalize(),lane=(i%2?1:-1)*width*.18,mesh=car(i?cs[(i-1)%cs.length]:selectedColor);mesh.position.copy(p).add(s.multiplyScalar(lane));mesh.rotation.y=Math.atan2(t.x,t.z);world.add(mesh);cars.push({mesh,u,last:u,lap:1,speed:0,lane,heading:mesh.rotation.y,skill:.78+Math.random()*.18})}player=cars[0]}
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(running&&e.code.startsWith('Arrow'))e.preventDefault()},{passive:false});addEventListener('keyup',e=>keys[e.code]=false);let prediction={forward:0,backward:0,left:0,right:0},cameraOn=false,stream=null,model=null,predictTimer=null,modelLoading=null;const video=document.getElementById('cameraVideo');function status(s,type=''){cameraStatus.textContent=s;cameraStatus.className='status '+type}function errText(e){if(e.name==='NotAllowedError')return'Camera permission was blocked. Open browser site settings, allow Camera, then reload.';if(e.name==='NotFoundError')return'No camera was found.';if(e.name==='NotReadableError')return'The camera is busy in another app or tab.';return e.message||String(e)}
async function stopCamera(){cameraOn=false;clearTimeout(predictTimer);predictTimer=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;prediction={forward:0,backward:0,left:0,right:0}}
async function loadModel(){if(model)return model;if(modelLoading)return modelLoading;modelLoading=(async()=>{status('Loading gesture model…');if(!window.tf||!window.tmImage)throw new Error('Machine-learning scripts did not load. Check the internet connection and reload.');await tf.setBackend('cpu');await tf.ready();const m=await Promise.race([tmImage.load(MODEL+'model.json',MODEL+'metadata.json'),new Promise((_,r)=>setTimeout(()=>r(new Error('Gesture model timed out while loading.')),20000))]);model=m;return m})().finally(()=>modelLoading=null);return modelLoading}
async function initCamera(){try{if(!isSecureContext)throw new Error('Camera requires HTTPS.');if(!navigator.mediaDevices?.getUserMedia)throw new Error('This browser does not support camera access.');await stopCamera();status('Waiting for camera permission…');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'user'},width:{ideal:320,max:480},height:{ideal:240,max:360},frameRate:{ideal:15,max:20}},audio:false});video.srcObject=stream;await Promise.race([video.play(),new Promise((_,r)=>setTimeout(()=>r(new Error('Camera preview timed out.')),8000))]);await loadModel();cameraOn=true;cameraBox.style.display='block';status('Camera ready. Gesture controls are active.','good');controlLabel.textContent='Camera ready';schedulePredict(50);return true}catch(e){console.error('Camera startup failed:',e);await stopCamera();const msg=errText(e);status(msg,'bad');toast(msg);controlLabel.textContent='Keys';return false}}
function schedulePredict(ms=180){clearTimeout(predictTimer);if(cameraOn)predictTimer=setTimeout(predictOnce,ms)}async function predictOnce(){if(!cameraOn||!model||video.readyState<2){schedulePredict(250);return}try{const out=await model.predict(video,false);prediction={forward:0,backward:0,left:0,right:0};for(const q of out){const k=q.className.toLowerCase().trim();if(k in prediction)prediction[k]=q.probability}const sorted=Object.entries(prediction).sort((a,b)=>b[1]-a[1]);predictionEl.innerHTML=sorted.map(([k,v])=>`${k}: ${Math.round(v*100)}%<div class="bar"><div class="fill" style="width:${v*100}%"></div></div>`).join('');controlLabel.textContent=sorted[0][1]>.55?'Gesture: '+sorted[0][0]:'Gesture: waiting…'}catch(e){console.error('Prediction failed:',e);status('Prediction error: '+errText(e),'bad');cameraOn=false;toast('Gesture prediction stopped. Keyboard controls still work.');controlLabel.textContent='Keys';return}schedulePredict(180)}
const colorsEl=document.getElementById('colors'),predictionEl=document.getElementById('prediction');function input(){let th=0,st=0;if(cameraOn){const b=Object.entries(prediction).sort((a,b)=>b[1]-a[1])[0];if(b&&b[1]>.55){if(b[0]==='forward')th=1;if(b[0]==='backward')th=-1;if(b[0]==='left')st=-1;if(b[0]==='right')st=1}}if(keys.ArrowUp||keys.KeyW)th=1;if(keys.ArrowDown||keys.KeyS)th=-1;if(keys.ArrowLeft||keys.KeyA)st=-1;if(keys.ArrowRight||keys.KeyD)st=1;return{th,st}}
function nearest(pos,g){let bu=g,bd=1e9;for(let j=-8;j<=8;j++){let u=(g+j*.003+1)%1,d=curve.getPointAt(u).distanceToSquared(pos);if(d<bd){bd=d;bu=u}}return{u:bu,d:Math.sqrt(bd)}}function progress(c){let n=nearest(c.mesh.position,c.u);c.last=c.u;c.u=n.u;if(c.last>.9&&c.u<.1&&c.speed>0)c.lap++;c.progress=(c.lap-1)+c.u;return n.d}
function update(dt){if(!started)return;let i=input();player.speed+=i.th*28*dt;player.speed*=Math.pow(.987,dt*60);player.speed=THREE.MathUtils.clamp(player.speed,-7,42);player.heading+=i.st*(1.15+Math.abs(player.speed)/55)*dt*Math.sign(player.speed||1);player.mesh.rotation.y=player.heading;player.mesh.position.x+=Math.sin(player.heading)*player.speed*dt;player.mesh.position.z+=Math.cos(player.heading)*player.speed*dt;let d=progress(player),center=curve.getPointAt(player.u);player.mesh.position.y=THREE.MathUtils.lerp(player.mesh.position.y,center.y,.16);if(d>width*.52){player.speed*=.92;player.mesh.position.lerp(center,.02)}for(let x=1;x<cars.length;x++){let c=cars[x];c.speed+=(31+c.skill*8-c.speed)*dt*1.6;let target=curve.getPointAt((c.u+(8+c.speed*.35)/length)%1),dx=target.x-c.mesh.position.x,dz=target.z-c.mesh.position.z,des=Math.atan2(dx,dz),df=des-c.heading;while(df>Math.PI)df-=Math.PI*2;while(df<-Math.PI)df+=Math.PI*2;c.heading+=df*dt*(2.2+c.skill);c.mesh.rotation.y=c.heading;c.mesh.position.x+=Math.sin(c.heading)*c.speed*dt;c.mesh.position.z+=Math.cos(c.heading)*c.speed*dt;progress(c);let cp=curve.getPointAt(c.u);c.mesh.position.y=THREE.MathUtils.lerp(c.mesh.position.y,cp.y,.2)}let ranked=[...cars].sort((a,b)=>b.progress-a.progress);pos.textContent=ranked.indexOf(player)+1;lap.textContent=Math.min(player.lap,3);speed.textContent=Math.max(0,Math.round(player.speed*6));let f=new THREE.Vector3(Math.sin(player.heading),0,Math.cos(player.heading)),ct=player.mesh.position.clone().add(new THREE.Vector3(0,2,0)),cp=ct.clone().add(f.clone().multiplyScalar(-12)).add(new THREE.Vector3(0,7,0));camera.position.lerp(cp,.12);camera.lookAt(ct.clone().add(f.multiplyScalar(8)))}
function animate(){requestAnimationFrame(animate);let dt=Math.min(.033,clock.getDelta());if(running)update(dt);renderer.render(scene,camera)}function startGame(){init3D();build();spawn();mapName.textContent=maps[mapKey].name;menu.style.display='none';hud.style.display='flex';bottom.style.display='flex';running=true;started=false;let n=3;countdown.style.display='grid';countdown.textContent=n;let t=setInterval(()=>{n--;if(n>0)countdown.textContent=n;else if(n===0)countdown.textContent='GO!';else{clearInterval(t);countdown.style.display='none';started=true}},700)}function toast(s){toastEl.textContent=s;toastEl.style.display='block';setTimeout(()=>toastEl.style.display='none',4000)}const toastEl=document.getElementById('toast');
testCamera.onclick=async()=>{testCamera.disabled=true;const ok=await initCamera();testCamera.disabled=false;if(ok)toast('Camera test passed!')};startCamera.onclick=async()=>{startCamera.disabled=true;startCamera.textContent='Starting…';const ok=await initCamera();startCamera.disabled=false;startCamera.textContent='Camera & Race';if(ok)startGame()};startKeyboard.onclick=async()=>{await stopCamera();cameraBox.style.display='none';controlLabel.textContent='Keys';startGame()};restart.onclick=startGame;cameraToggle.onclick=async()=>cameraOn?(await stopCamera(),cameraBox.style.display='none',controlLabel.textContent='Keys'):await initCamera();exit.onclick=()=>location.reload();init3D();animate();
</script></body></html>
