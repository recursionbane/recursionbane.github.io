<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Motion Strike</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070a12;color:#eef5ff;font-family:system-ui,sans-serif}canvas{display:block}button,select,input{font:inherit}.screen{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,#1d3158,#070a12 65%)}.card{width:min(720px,94vw);padding:26px;border:1px solid #33415e;border-radius:20px;background:#0b1220ee;box-shadow:0 30px 100px #000b}.title{font-size:clamp(38px,9vw,76px);font-weight:1000;letter-spacing:-.06em;margin:0}.sub{opacity:.72;margin:4px 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{display:block;font-size:11px;letter-spacing:.13em;text-transform:uppercase;opacity:.7;margin-bottom:5px}select,input,button{width:100%;padding:12px;border-radius:10px;border:1px solid #33415e;background:#121d31;color:white}button{border:0;background:linear-gradient(135deg,#2d82ff,#734dff);font-weight:900;cursor:pointer}button:disabled{opacity:.5}.row{display:flex;gap:8px}.status{min-height:23px;color:#ffd166;font-weight:800}.hint{font-size:12px;line-height:1.45;opacity:.68}#hud{display:none;position:fixed;inset:0;z-index:5;pointer-events:none}.top,.bottom{position:absolute;left:14px;right:14px;display:flex;justify-content:space-between}.top{top:14px}.bottom{bottom:14px;align-items:end}.pill{padding:8px 13px;border-radius:999px;background:#080d18d9;border:1px solid #35435e;font-weight:900}.blue{color:#59adff}.red{color:#ff5a70}.bar{width:min(280px,45vw);height:15px;border:1px solid #ffffff55;background:#0008;border-radius:20px;overflow:hidden}.bar div{height:100%;background:#4fd486}.ammo{font-size:30px;font-weight:1000;text-align:right}.small{font-size:11px;opacity:.7}#cross{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%)}#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 4px #000}#cross:before{width:20px;height:2px;top:9px}#cross:after{height:20px;width:2px;left:9px}#action{position:absolute;left:50%;bottom:75px;transform:translateX(-50%);font-size:24px;font-weight:1000;color:#ffd166;text-shadow:0 2px 6px #000}.scope{display:none;position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle,transparent 0 29%,#000 30% 100%)}#cam{display:none;position:absolute;left:14px;top:62px;width:170px;padding:8px;background:#080d18dd;border:1px solid #35435e;border-radius:12px;pointer-events:auto}#cam canvas{width:100%;border-radius:8px}#pred{font-size:11px;margin-top:4px}.mobile{display:none;position:absolute;inset:0;pointer-events:auto}.stick{position:absolute;left:22px;bottom:82px;width:120px;height:120px;border-radius:50%;background:#ffffff12;border:1px solid #ffffff38}.nub{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#ffffff55}.mbtns{position:absolute;right:16px;bottom:70px;display:grid;grid-template-columns:64px 64px;gap:9px}.mbtns button{height:58px;padding:3px;border-radius:50%;background:#172641dd;border:1px solid #ffffff40}@media(max-width:800px),(pointer:coarse){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.mobile{display:block}#cam{width:125px}}
</style>
</head>
<body>
<div id="menu" class="screen"><div class="card"><h1 class="title">MOTION STRIKE</h1><div class="sub">3D pose-controlled team arena</div><div class="grid">
<div><label>Mode</label><select id="mode"><option value="2">2v2 Rival</option><option value="5">5v5 Squad</option></select></div>
<div><label>Map</label><select id="map"><option value="yard">Neon Yard</option><option value="canyon">Dust Canyon</option><option value="ice">Polar Station</option></select></div>
<div><label>Team</label><select id="team"><option value="blue">Blue</option><option value="red">Red</option></select></div>
<div><label>Controls</label><select id="controls"><option value="keys">Keyboard / Touch</option><option value="camera">Teachable Machine Camera</option></select></div>
<div class="wide"><label>Party code (NPC prototype)</label><div class="row"><input id="party" maxlength="12" placeholder="Optional"><button id="generate" style="width:170px;background:#192640">Generate</button></div></div>
<div id="status" class="wide status"></div><button id="start" class="wide">START MATCH</button>
<div class="wide hint"><b>Keys:</b> WASD or arrows move · mouse aims · click fires · R reloads · 1 rifle · 2 sniper · Space jumps · Shift rolls · right-click scopes. Camera model: Nh68eUDmN.</div>
</div></div></div>
<div id="hud"><div class="top"><div class="pill"><span class="blue">BLUE <b id="bs">0</b></span> — <span class="red"><b id="rs">0</b> RED</span></div><div id="timer" class="pill">03:00</div></div><div id="cross"></div><div id="action"></div><div id="cam"><div id="webcam"></div><div id="pred">Camera loading…</div></div><div class="bottom"><div><div class="small">HEALTH <span id="hp">100</span></div><div class="bar"><div id="hpbar"></div></div><div id="weapon" class="small">RIFLE</div></div><div class="ammo"><span id="ammo">30</span><span class="small"> / <span id="reserve">120</span></span></div></div><div class="mobile"><div id="stick" class="stick"><div id="nub" class="nub"></div></div><div class="mbtns"><button data-a="fire">FIRE</button><button data-a="reload">R</button><button data-a="jump">JUMP</button><button data-a="roll">ROLL</button></div></div></div>
<div id="scope" class="scope"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script>
const $=s=>document.querySelector(s), MODEL='https://teachablemachine.withgoogle.com/models/Nh68eUDmN/';
let scene,camera,renderer,clock,player,actors=[],walls=[],shots=[],running=false,keys={},yaw=0,pitch=-.12,moveTouch={x:0,y:0},teamSize=2,myTeam='blue',scores={blue:0,red:0},endAt=0,tmModel,webcam,lastPose='';
const guns={rifle:{mag:30,damage:18,rate:120,reload:1200,range:80},sniper:{mag:5,damage:85,rate:850,reload:1900,range:140}};
const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.7});
function cube(x,y,z,c){const m=new THREE.Mesh(new THREE.BoxGeometry(x,y,z),material(c));m.castShadow=m.receiveShadow=true;return m}
function character(team){const g=new THREE.Group(),body=cube(1,1.4,.65,team==='blue'?0x278cff:0xff355b),head=new THREE.Mesh(new THREE.SphereGeometry(.37,14,10),material(0xefc49c)),gun=cube(.15,.15,1.15,0x202632);body.position.y=.9;head.position.y=1.92;gun.position.set(.43,1.25,-.55);g.add(body,head,gun);return g}
class Actor{constructor(team,human){this.team=team;this.human=human;this.group=character(team);this.hp=100;this.dead=false;this.velY=0;this.weapon='rifle';this.ammo={rifle:30,sniper:5};this.reserve={rifle:120,sniper:25};this.lastShot=0;this.reloading=false;this.rollUntil=0;this.target=null;this.think=0;scene.add(this.group);actors.push(this)}spawn(i){this.group.position.set(this.team==='blue'?-20:20,1,(i-(teamSize-1)/2)*5);this.hp=100;this.dead=false;this.group.visible=true;this.velY=0;this.reloading=false;if(this.human)hud()}hit(n,attacker){if(this.dead)return;this.hp-=n;if(this.human)hud();if(this.hp<=0){this.dead=true;this.group.visible=false;scores[attacker.team]++;$('#bs').textContent=scores.blue;$('#rs').textContent=scores.red;setTimeout(()=>this.spawn(Math.floor(Math.random()*teamSize)),1500)}}}
function addWall(m,x,y,z){m.position.set(x,y,z);scene.add(m);walls.push(m)}
function buildMap(name){const ground=name==='ice'?0xbcddeb:name==='canyon'?0x95613e:0x222b43, wall=name==='ice'?0xe4f5ff:name==='canyon'?0x6e422b:0x394763;addWall(cube(82,1,62,ground),0,-.5,0);for(let x=-32;x<=32;x+=8){addWall(cube(3,3,3,wall),x,1.5,(Math.floor(x/8)%2)*10);addWall(cube(3,5,4,wall),x,2.5,-18+(Math.abs(x)%4)*3)}for(let z=-24;z<=24;z+=12){addWall(cube(5,4,2,wall),-14,2,z);addWall(cube(5,4,2,wall),14,2,z)}addWall(cube(10,2,6,wall),0,1,0)}
function spawnTeams(){for(const t of ['blue','red'])for(let i=0;i<teamSize;i++){const a=new Actor(t,t===myTeam&&i===0);if(a.human)player=a;a.spawn(i)}}
function blocked(pos){if(Math.abs(pos.x)>39||Math.abs(pos.z)>29)return true;for(const w of walls){const b=new THREE.Box3().setFromObject(w);if(pos.x>b.min.x-.55&&pos.x<b.max.x+.55&&pos.z>b.min.z-.55&&pos.z<b.max.z+.55&&pos.y<b.max.y+1.7)return true}return false}
function move(a,dir,speed,dt){const old=a.group.position.clone();a.group.position.addScaledVector(dir,speed*dt);if(blocked(a.group.position)){a.group.position.x=old.x;a.group.position.z=old.z}a.velY-=20*dt;a.group.position.y+=a.velY*dt;if(a.group.position.y<=1){a.group.position.y=1;a.velY=0}}
function jump(a){if(!a.dead&&a.group.position.y<=1.01){a.velY=8.5;flash('JUMP')}}function roll(a){if(!a.dead&&Date.now()>a.rollUntil){a.rollUntil=Date.now()+550;flash('ROLL')}}
function reload(a){const g=guns[a.weapon];if(a.reloading||a.ammo[a.weapon]>=g.mag||a.reserve[a.weapon]<=0)return;a.reloading=true;flash(a.weapon==='sniper'?'SNIPER RELOAD':'RELOAD');if(a.human)hud();setTimeout(()=>{if(a.dead)return;a.reloading=false;const n=Math.min(g.mag-a.ammo[a.weapon],a.reserve[a.weapon]);a.ammo[a.weapon]+=n;a.reserve[a.weapon]-=n;if(a.human)hud()},g.reload)}
function ownerRoot(o){while(o.parent&&!actors.some(a=>a.group===o))o=o.parent;return o}
function fire(a){const now=Date.now(),g=guns[a.weapon];if(a.dead||a.reloading||now-a.lastShot<g.rate)return;if(a.ammo[a.weapon]<=0)return reload(a);a.lastShot=now;a.ammo[a.weapon]--;if(a.human)hud();const origin=a.group.position.clone().add(new THREE.Vector3(0,1.35,0));let dir;if(a.human)dir=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(pitch,yaw,0,'YXZ')).normalize();else{if(!a.target)return;dir=a.target.group.position.clone().add(new THREE.Vector3(0,1,0)).sub(origin).normalize();dir.x+=(Math.random()-.5)*(a.weapon==='sniper' ? 0.025 : 0.09);dir.y+=(Math.random()-.5)*.05;dir.normalize()}const ray=new THREE.Raycaster(origin,dir,0,g.range),targets=actors.filter(x=>x.team!==a.team&&!x.dead).map(x=>x.group),hits=ray.intersectObjects(targets,true);let end=origin.clone().addScaledVector(dir,g.range);if(hits[0]){const victim=actors.find(x=>x.group===ownerRoot(hits[0].object));if(victim){end=hits[0].point;victim.hit(g.damage,a)}}const geo=new THREE.BufferGeometry().setFromPoints([origin,end]),line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:a.team==='blue'?0x59adff:0xff5a70}));scene.add(line);shots.push({line,until:now+90});if(a.human&&a.weapon==='sniper')flash('SNIPER FIRE')}
function ai(a,dt){if(a.dead)return;if(Date.now()>a.think){a.think=Date.now()+350+Math.random()*500;a.target=actors.filter(x=>x.team!==a.team&&!x.dead).sort((x,y)=>x.group.position.distanceTo(a.group.position)-y.group.position.distanceTo(a.group.position))[0];if(Math.random()<.08)a.weapon=a.weapon==='rifle'?'sniper':'rifle'}if(!a.target)return;const delta=a.target.group.position.clone().sub(a.group.position),dist=delta.length();delta.y=0;delta.normalize();const strafe=new THREE.Vector3(-delta.z,0,delta.x).multiplyScalar(Math.sin(Date.now()/600+a.group.id)*.55),dir=delta.multiplyScalar(dist>11?1:.1).add(strafe).normalize();move(a,dir,Date.now()<a.rollUntil?10:5.1,dt);a.group.rotation.y=Math.atan2(-dir.x,-dir.z);if(dist<45&&Math.random()<dt*(a.weapon==='sniper' ? 0.7 : 3.6))fire(a);if(a.ammo[a.weapon]===0)reload(a);if(Math.random()<dt*.05)jump(a)}
function playerStep(dt){if(player.dead)return;const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)+moveTouch.y,s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+moveTouch.x,dir=new THREE.Vector3(s,0,-f);if(dir.lengthSq()){dir.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw);move(player,dir,Date.now()<player.rollUntil?12:6.3,dt);player.group.rotation.y=yaw}else move(player,new THREE.Vector3(),0,dt);const off=new THREE.Vector3(0,2.2,5.4).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);camera.position.lerp(player.group.position.clone().add(off),.22);camera.lookAt(player.group.position.clone().add(new THREE.Vector3(0,1.4,0)).add(new THREE.Vector3(0,0,-6).applyEuler(new THREE.Euler(pitch,yaw,0,'YXZ'))))}
function hud(){$('#hp').textContent=Math.max(0,Math.ceil(player.hp));$('#hpbar').style.width=Math.max(0,player.hp)+'%';$('#ammo').textContent=player.ammo[player.weapon];$('#reserve').textContent=player.reserve[player.weapon];$('#weapon').textContent=player.weapon.toUpperCase()+(player.reloading?' — RELOADING':'')}
function flash(t){$('#action').textContent=t;clearTimeout(flash.t);flash.t=setTimeout(()=>$('#action').textContent='',600)}
function loop(){if(!running)return;requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);playerStep(dt);actors.filter(a=>!a.human).forEach(a=>ai(a,dt));shots=shots.filter(s=>{if(Date.now()>s.until){scene.remove(s.line);return false}return true});const left=Math.max(0,endAt-Date.now()),m=Math.floor(left/60000),s=Math.floor(left/1000)%60;$('#timer').textContent=`0${m}:${String(s).padStart(2,'0')}`;if(left<=0||scores.blue>=10||scores.red>=10)return finish();renderer.render(scene,camera)}
function finish(){running=false;if(document.exitPointerLock)document.exitPointerLock();$('#hud').style.display='none';$('#menu').style.display='grid';$('#status').textContent=`${scores.blue===scores.red?'DRAW':scores.blue>scores.red?'BLUE WINS':'RED WINS'} — Blue ${scores.blue}, Red ${scores.red}`;renderer.domElement.remove()}
function bind(){addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')jump(player);if(e.code.startsWith('Shift'))roll(player);if(e.code==='KeyR')reload(player);if(e.code==='Digit1'){player.weapon='rifle';hud()}if(e.code==='Digit2'){player.weapon='sniper';hud()}});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0025;pitch=Math.max(-.7,Math.min(.5,pitch-e.movementY*.002))}});addEventListener('mousedown',e=>{if(e.button===0)fire(player);if(e.button===2&&player.weapon==='sniper')$('#scope').style.display='block'});addEventListener('mouseup',e=>{if(e.button===2)$('#scope').style.display='none'});addEventListener('contextmenu',e=>e.preventDefault());renderer.domElement.addEventListener('click',()=>{if(renderer.domElement.requestPointerLock)renderer.domElement.requestPointerLock()});document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>({fire:()=>fire(player),reload:()=>reload(player),jump:()=>jump(player),roll:()=>roll(player)}[b.dataset.a]()));stick()}
function stick(){const el=$('#stick'),nub=$('#nub');let id=null;const set=e=>{const r=el.getBoundingClientRect(),p=e.touches?[...e.touches].find(t=>t.identifier===id):e;if(!p)return;const x=Math.max(-44,Math.min(44,p.clientX-r.left-r.width/2)),y=Math.max(-44,Math.min(44,p.clientY-r.top-r.height/2));nub.style.transform=`translate(${x}px,${y}px)`;moveTouch={x:x/44,y:-y/44}};el.addEventListener('touchstart',e=>{id=e.changedTouches[0].identifier;set(e)},{passive:false});el.addEventListener('touchmove',e=>{e.preventDefault();set(e)},{passive:false});el.addEventListener('touchend',()=>{id=null;moveTouch={x:0,y:0};nub.style.transform=''})}
async function enableCamera(){if(!window.tmImage)throw new Error('Teachable Machine library failed to load');tmModel=await tmImage.load(MODEL+'model.json',MODEL+'metadata.json');webcam=new tmImage.Webcam(170,128,true);await webcam.setup();await webcam.play();$('#webcam').appendChild(webcam.canvas);$('#cam').style.display='block';camLoop()}
async function camLoop(){if(!webcam)return;webcam.update();const all=await tmModel.predict(webcam.canvas),best=all.sort((a,b)=>b.probability-a.probability)[0];$('#pred').textContent=`${best.className}: ${Math.round(best.probability*100)}%`;if(best.probability>.78)pose(best.className.toLowerCase());requestAnimationFrame(camLoop)}
function pose(n){if(!running)return;if(n!==lastPose){lastPose=n;moveTouch={x:0,y:0}}if(/sniper.*reload|reload.*sniper/.test(n)){player.weapon='sniper';reload(player)}else if(/reload/.test(n))reload(player);else if(/sniper/.test(n)){player.weapon='sniper';hud();fire(player)}else if(/gun|fire|shoot/.test(n)){player.weapon='rifle';hud();fire(player)}else if(/jump/.test(n))jump(player);else if(/roll|dodge/.test(n))roll(player);else if(/left/.test(n))moveTouch.x=-1;else if(/right/.test(n))moveTouch.x=1;else if(/forward|up/.test(n))moveTouch.y=1;else if(/back|down/.test(n))moveTouch.y=-1}
async function startGame(){const btn=$('#start');btn.disabled=true;$('#status').textContent='Starting match…';try{if(!window.THREE)throw new Error('3D engine did not load. Refresh the page and try again.');teamSize=Number($('#mode').value);myTeam=$('#team').value;scores={blue:0,red:0};actors=[];walls=[];shots=[];scene=new THREE.Scene();scene.fog=new THREE.Fog(0x09101d,38,110);camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,200);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);clock=new THREE.Clock();scene.add(new THREE.HemisphereLight(0xc9ddff,0x21170c,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-20,35,15);sun.castShadow=true;scene.add(sun);buildMap($('#map').value);spawnTeams();bind();running=true;endAt=Date.now()+180000;$('#bs').textContent=$('#rs').textContent='0';$('#menu').style.display='none';$('#hud').style.display='block';$('#status').textContent='';hud();loop();if($('#controls').value==='camera'&&!tmModel){enableCamera().catch(err=>{console.error(err);$('#pred').textContent='Camera unavailable';})}}catch(err){console.error(err);$('#status').textContent='Could not start: '+(err.message||err);if(renderer&&renderer.domElement&&renderer.domElement.parentNode)renderer.domElement.remove()}finally{btn.disabled=false}}
window.addEventListener('error',e=>{$('#status').textContent='Game error: '+e.message});
$('#generate').onclick=()=>$('#party').value=Math.random().toString(36).slice(2,8).toUpperCase();
$('#start').addEventListener('click',startGame);
</script>
</body></html>
