);X.beginPath();X.moveTo(500,F.t);X.lineTo(500,F.b);X.stroke();X.beginPath();X.arc(500,300,75,0,7);X.stroke();X.strokeRect(F.l-25,F.gt,25,F.gb-F.gt);X.strokeRect(F.r,F.gt,25,F.gb-F.gt);[[P,'#1976ff',R[$('country').value].flag],[A,'#ef3340',R[AI]?R[AI].flag:'🤖']].forEach(([q,col,f])=>{X.beginPath();X.arc(q.x,q.y,q.r,0,7);X.fillStyle=col;X.fill();X.strokeStyle='#fff';X.stroke();X.font='16px Arial';X.textAlign='center';X.fillStyle='#fff';X.fillText(f,q.x,q.y+5)});X.beginPath();X.arc(B.x,B.y,B.r,0,7);X.fillStyle='#fff';X.fill();X.strokeStyle='#111';X.stroke()}function end(){run=0;$('over').classList.remove('hide');let win=us>them;$('title').textContent=win?$('country').value+' WINS!':AI+' WINS!';$('result').textContent=win?$('country').value+' advances to the next round, round of 16!':AI+' advances to the next match, round of 32!'}function loop(t){if(!run)return;acc+=t-last;last=t;while(acc>=1000){left--;acc-=1000;hud();if(left<=0){if(us===them)left=30;else{end();return}}}move();draw();requestAnimationFrame(loop)}fillCountries();draw();</script>
