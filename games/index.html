<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>FIFArcade</title><style>*{box-sizing:border-box}html,body{margin:0;background:#020604;color:#fff;font-family:Arial,sans-serif;overscroll-behavior:none;touch-action:none}body{min-height:100vh;display:grid;place-items:center}#app{width:min(100vw,1100px);background:#07170f;border:5px solid #26352d;border-radius:18px;overflow:hidden}header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#030806;font-weight:900;color:#caff35}#hud{color:#fff;font-size:18px}canvas{display:block;width:100%;height:auto;background:#16854a;touch-action:none}.overlay{position:fixed;inset:0;background:#000d;display:grid;place-items:center;padding:16px;z-index:20}.hide{display:none!important}.card{width:min(620px,100%);background:#0b2117;border:2px solid #65a878;border-radius:18px;padding:18px}h1{margin:0 0 8px;color:#caff35;font-size:48px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}select,button{width:100%;padding:13px;border-radius:10px;border:2px solid #507b5e;background:#06130d;color:#fff;font-weight:800}button{background:#caff35;color:#071107;margin-top:12px}.hint{color:#b6c7bd;font-size:14px;line-height:1.4}@media(max-width:650px){h1{font-size:38px}.grid{grid-template-columns:1fr}}</style></head><body><div id="app"><header><span>FIFArcade</span><span id="hud">0–0 • 2:00</span></header><canvas id="game" width="1100" height="650"></canvas></div><div id="menu" class="overlay"><div class="card"><h1>FIFArcade</h1><p>Drag your player. Slam the ball. Bank it off the walls. Score more goals than the AI.</p><div class="grid"><select id="difficulty"><option>BABY</option><option>EASY</option><option selected>MEDIUM</option><option>HARD</option><option>XTRA HARD</option><option>DEMON</option></select><select id="country"></select><select id="player"></select><select id="weather"><option>Sunny</option><option>Night</option><option>Rain</option><option>Snow</option></select></div><button id="start">KICK OFF</button><p class="hint">Touch or click directly on your blue player, then drag. Your speed is capped to match the AI. The ball can move much faster than either player.</p></div></div><div id="over" class="overlay hide"><div class="card"><h1 id="resultTitle">MATCH OVER</h1><p id="resultText"></p><button id="again">PLAY AGAIN</button></div></div><script>const C=document.getElementById('game'),X=C.getContext('2d'),hud=document.getElementById('hud');const countries={Argentina:['Lionel Messi','Julián Álvarez','Lautaro Martínez'],Brazil:['Vinícius Jr','Neymar Jr','Raphinha'],England:['Jude Bellingham','Harry Kane','Bukayo Saka'],France:['Kylian Mbappé','Ousmane Dembélé','Michael Olise'],Germany:['Jamal Musiala','Florian Wirtz','Kai Havertz'],Portugal:['Cristiano Ronaldo','Bruno Fernandes','Rafael Leão'],Spain:['Lamine Yamal','Pedri','Rodri'],Netherlands:['Virgil van Dijk','Frenkie de Jong','Cody Gakpo'],Croatia:['Luka Modrić','Joško Gvardiol','Andrej Kramarić'],Japan:['Takefusa Kubo','Kaoru Mitoma','Wataru Endo'],South Korea:['Son Heung-min','Lee Kang-in','Hwang Hee-chan'],Mexico:['Santiago Giménez','Raúl Jiménez','Edson Álvarez'],USA:['Christian Pulisic','Antonee Robinson','Weston McKennie'],Canada:['Alphonso Davies','Jonathan David','Tajon Buchanan'],Morocco:['Achraf Hakimi','Brahim Díaz','Yassine Bounou'],Senegal:['Sadio Mané','Nicolas Jackson','Kalidou Koulibaly'],Colombia:['Luis Díaz','James Rodríguez','Jhon Arias'],Ecuador:['Moisés Caicedo','Enner Valencia','Piero Hincapié'],Australia:['Mathew Ryan','Jackson Irvine','Nestory Irankunda'],Iran:['Mehdi Taremi','Saman Ghoddos','Alireza Jahanbakhsh'],New Zealand:['Chris Wood','Marko Stamenić','Liberato Cacace']};const country=document.getElementById('country'),player=document.getElementById('player');Object.keys(countries).forEach(n=>country.add(new Option(n,n)));function fillPlayers(){player.innerHTML='';countries[country.value].forEach(n=>player.add(new Option(n,n)))}country.onchange=fillPlayers;fillPlayers();const goalH=190,goalY=(C.height-goalH)/2,wall=18;let running=false,last=0,timeLeft=120,score=[0,0],drag=false,pointer={x:180,y:C.height/2};let playerSpeed=300,aiSpeed=300,ballMax=900;const human={x:180,y:C.height/2,vx:0,vy:0,r:28},ai={x:C.width-180,y:C.height/2,vx:0,vy:0,r:28,plan:'direct',replan:0,target:{x:0,y:0}},ball={x:C.width/2,y:C.height/2,vx:0,vy:0,r:17};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),len=(x,y)=>Math.hypot(x,y)||1;function reset(kickoff=0){human.x=180;human.y=C.height/2;human.vx=human.vy=0;ai.x=C.width-180;ai.y=C.height/2;ai.vx=ai.vy=0;ball.x=C.width/2;ball.y=C.height/2;ball.vx=kickoff?kickoff*170:0;ball.vy=(Math.random()-.5)*100;pointer.x=human.x;pointer.y=human.y;ai.replan=0}function difficulty(){const d=document.getElementById('difficulty').value;return {BABY:220,EASY:255,MEDIUM:300,HARD:335,'XTRA HARD':370,DEMON:410}[d]}function start(){aiSpeed=difficulty();playerSpeed=aiSpeed;timeLeft=120;score=[0,0];running=true;last=performance.now();reset(Math.random()<.5?-1:1);document.getElementById('menu').classList.add('hide');document.getElementById('over').classList.add('hide');requestAnimationFrame(loop)}document.getElementById('start').onclick=start;document.getElementById('again').onclick=()=>document.getElementById('menu').classList.remove('hide');function pos(e){const r=C.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*C.width/r.width,y:(p.clientY-r.top)*C.height/r.height}}function down(e){const p=pos(e);if(Math.hypot(p.x-human.x,p.y-human.y)<=human.r*2.2){drag=true;pointer=p;e.preventDefault()}}function move(e){if(!drag)return;pointer=pos(e);e.preventDefault()}function up(e){drag=false;if(e)e.preventDefault()}C.addEventListener('pointerdown',down);C.addEventListener('pointermove',move);addEventListener('pointerup',up);C.addEventListener('touchstart',down,{passive:false});C.addEventListener('touchmove',move,{passive:false});addEventListener('touchend',up,{passive:false});function steer(o,tx,ty,max,dt){let dx=tx-o.x,dy=ty-o.y,d=len(dx,dy),want=Math.min(max,d/dt);o.vx=dx/d*want;o.vy=dy/d*want;o.x+=o.vx*dt;o.y+=o.vy*dt;o.x=clamp(o.x,wall+o.r,C.width-wall-o.r);o.y=clamp(o.y,wall+o.r,C.height-wall-o.r)}function choosePlan(){const options=['direct','flankTop','flankBottom','bankTop','bankBottom'];const weights=[.34,.16,.16,.17,.17];let r=Math.random(),s=0;for(let i=0;i<options.length;i++){s+=weights[i];if(r<s){ai.plan=options[i];break}}ai.replan=.75+Math.random()*1.1}function desiredBallDirection(){const gx=0,gy=C.height/2+(Math.random()-.5)*goalH*.5;if(ai.plan==='direct')return{x:gx-ball.x,y:gy-ball.y};if(ai.plan==='flankTop')return{x:-1,y:-.65};if(ai.plan==='flankBottom')return{x:-1,y:.65};const top=ai.plan==='bankTop',wy=top?wall+ball.r:C.height-wall-ball.r;const reflectedGoalY=top?2*wy-gy:2*wy-gy;return{x:gx-ball.x,y:reflectedGoalY-ball.y}}function updateAI(dt){ai.replan-=dt;if(ai.replan<=0)choosePlan();let dir=desiredBallDirection(),m=len(dir.x,dir.y);dir.x/=m;dir.y/=m;const behind=ai.r+ball.r+22;let tx=ball.x-dir.x*behind,ty=ball.y-dir.y*behind;if((ai.plan==='flankTop'||ai.plan==='flankBottom')&&ball.x>250){ty=ai.plan==='flankTop'?110:C.height-110;tx=ball.x+70}steer(ai,tx,ty,aiSpeed,dt);const d=Math.hypot(ai.x-ball.x,ai.y-ball.y);if(d<ai.r+ball.r+10){const kick=520+Math.random()*170;ball.vx+=dir.x*kick;ball.vy+=dir.y*kick+(Math.random()-.5)*90;ai.replan=.18}}function collidePlayer(o,power=1){let dx=ball.x-o.x,dy=ball.y-o.y,d=len(dx,dy),min=o.r+ball.r;if(d>=min)return;let nx=dx/d,ny=dy/d,over=min-d;ball.x+=nx*over;ball.y+=ny*over;const rel=(o.vx-ball.vx)*nx+(o.vy-ball.vy)*ny;if(rel>0){const impulse=(rel*1.25+130)*power;ball.vx+=nx*impulse;ball.vy+=ny*impulse}if(o===human&&Math.hypot(o.vx,o.vy)>playerSpeed*.78){ball.vx+=nx*260;ball.vy+=ny*260}}function updateBall(dt){ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;const dragFactor=Math.pow(.992,dt*60);ball.vx*=dragFactor;ball.vy*=dragFactor;let s=Math.hypot(ball.vx,ball.vy);if(s>ballMax){ball.vx*=ballMax/s;ball.vy*=ballMax/s}if(ball.y-ball.r<wall){ball.y=wall+ball.r;ball.vy=Math.abs(ball.vy)*.93}if(ball.y+ball.r>C.height-wall){ball.y=C.height-wall-ball.r;ball.vy=-Math.abs(ball.vy)*.93}const inGoal=ball.y>goalY&&ball.y<goalY+goalH;if(ball.x-ball.r<wall&&!inGoal){ball.x=wall+ball.r;ball.vx=Math.abs(ball.vx)*.93}if(ball.x+ball.r>C.width-wall&&!inGoal){ball.x=C.width-wall-ball.r;ball.vx=-Math.abs(ball.vx)*.93}if(ball.x<-ball.r){score[1]++;reset(1)}if(ball.x>C.width+ball.r){score[0]++;reset(-1)}}function update(dt){if(drag)steer(human,pointer.x,pointer.y,playerSpeed,dt);else{human.vx*=.72;human.vy*=.72}updateAI(dt);collidePlayer(human,1.05);collidePlayer(ai,1);updateBall(dt);timeLeft-=dt;if(timeLeft<=0){running=false;document.getElementById('over').classList.remove('hide');document.getElementById('resultTitle').textContent=score[0]>score[1]?'YOU WIN':score[0]<score[1]?'AI WINS':'DRAW';document.getElementById('resultText').textContent=score[0]+' – '+score[1]}}function field(){X.clearRect(0,0,C.width,C.height);let weather=document.getElementById('weather').value;X.fillStyle=weather==='Night'?'#0b4a32':'#16854a';X.fillRect(0,0,C.width,C.height);X.strokeStyle='#ffffffaa';X.lineWidth=5;X.strokeRect(wall,wall,C.width-wall*2,C.height-wall*2);X.beginPath();X.moveTo(C.width/2,wall);X.lineTo(C.width/2,C.height-wall);X.stroke();X.beginPath();X.arc(C.width/2,C.height/2,95,0,Math.PI*2);X.stroke();X.strokeStyle='#caff35';X.strokeRect(-25,goalY,45,goalH);X.strokeStyle='#ff5d5d';X.strokeRect(C.width-20,goalY,45,goalH);if(weather==='Rain'){X.strokeStyle='#bde8ff55';X.lineWidth=2;for(let i=0;i<80;i++){let x=(i*83+performance.now()*.25)%C.width,y=(i*47+performance.now()*.4)%C.height;X.beginPath();X.moveTo(x,y);X.lineTo(x-8,y+18);X.stroke()}}}function disc(o,color,label){X.fillStyle='rgba(0,0,0,.28)';X.beginPath();X.ellipse(o.x+4,o.y+8,o.r,o.r*.55,0,0,Math.PI*2);X.fill();X.fillStyle=color;X.beginPath();X.arc(o.x,o.y,o.r,0,Math.PI*2);X.fill();X.strokeStyle='#fff';X.lineWidth=4;X.stroke();X.fillStyle='#fff';X.font='bold 15px Arial';X.textAlign='center';X.fillText(label,o.x,o.y+5)}function draw(){field();disc(human,'#278cff','YOU');disc(ai,'#ff4055','AI');X.fillStyle='#fff';X.beginPath();X.arc(ball.x,ball.y,ball.r,0,Math.PI*2);X.fill();X.strokeStyle='#111';X.lineWidth=3;X.stroke();if(drag){X.strokeStyle='#9dd7ff88';X.lineWidth=4;X.beginPath();X.moveTo(human.x,human.y);X.lineTo(pointer.x,pointer.y);X.stroke()}hud.textContent=score[0]+'–'+score[1]+' • '+Math.max(0,Math.ceil(timeLeft/60))+':'+String(Math.max(0,Math.floor(timeLeft%60))).padStart(2,'0')}function loop(t){if(!running)return;let dt=Math.min(.025,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(loop)}draw();</script></body></html>
